<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Calendario de contenido</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg: #14171C;
    --surface: #1B1F27;
    --surface-2: #21262F;
    --border: #2A2F3A;
    --text: #EDEFF2;
    --muted: #8B93A1;
    --vacio: #3A4051;
    --idea: #E8A33D;
    --editado: #5B93E8;
    --programado: #3FBF9F;
    --warn: #E86A5C;
    --radius: 14px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  header{
    padding: 22px 18px 10px;
  }
  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--idea);
    margin: 0 0 4px;
  }
  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .month-nav{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 14px 6px 6px;
    margin: 0 12px;
  }
  .month-nav button{
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
  }
  .month-nav button:active{ background: var(--surface-2); }
  .month-label{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-transform: capitalize;
  }

  .legend{
    display:flex;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 18px 4px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .legend .sw{ width:8px; height:8px; border-radius:50%; }

  .cal-wrap{ padding: 10px 10px 0; }
  .weekdays{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    text-align:center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .weekdays div{ padding: 4px 0; }

  .grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .cell{
    aspect-ratio: 1 / 1.05;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 5px;
    display:flex;
    flex-direction:column;
    justify-content: space-between;
    cursor: pointer;
    position: relative;
  }
  .cell.empty-cell{ background: transparent; border-color: transparent; cursor: default; }
  .cell.today{ border-color: var(--idea); box-shadow: 0 0 0 1px var(--idea); }
  .cell.covered{ border-color: var(--programado); }
  .cell.needs-attention::after{
    content:'';
    position:absolute;
    top:5px; right:5px;
    width:5px; height:5px;
    border-radius:50%;
    background: var(--warn);
  }
  .cell .num{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .cell.today .num{ color: var(--idea); font-weight: 600; }
  .cell .dots{
    display:flex;
    gap: 4px;
    align-self: flex-start;
  }
  .cell .dot{
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--vacio);
    flex-shrink: 0;
  }
  .cell .dot.idea{ background: var(--idea); }
  .cell .dot.editado{ background: var(--editado); }
  .cell .dot.programado{ background: var(--programado); }

  .month-summary{
    margin: 18px 18px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display:flex;
    justify-content: space-between;
    font-size: 12.5px;
  }
  .month-summary .stat{ text-align:center; }
  .month-summary .stat b{
    display:block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
  }
  .month-summary .stat span{ color: var(--muted); font-size: 10.5px; }

  /* Day modal */
  .modal-backdrop{
    position: fixed; inset:0;
    background: rgba(10,12,16,0.72);
    display:none;
    align-items:flex-end;
    z-index: 30;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
    animation: slideup .2s ease;
  }
  @keyframes slideup{ from{ transform: translateY(20px); opacity:0; } to{ transform: translateY(0); opacity:1; } }
  .modal-head{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-bottom: 16px;
  }
  .modal-head h2{
    font-family:'Space Grotesk', sans-serif;
    font-size: 18px;
    margin: 0;
    text-transform: capitalize;
  }
  .close-btn{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 30px; height: 30px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }

  .slot{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .slot-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .slot input[type="text"]{
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .stage-row{
    display:flex;
    gap: 6px;
  }
  .stage-btn{
    flex:1;
    font-family:'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 8px 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    text-align:center;
    cursor:pointer;
  }
  .stage-btn[data-stage="idea"].active{ background: rgba(232,163,61,0.16); border-color: var(--idea); color: var(--idea); }
  .stage-btn[data-stage="editado"].active{ background: rgba(91,147,232,0.16); border-color: var(--editado); color: var(--editado); }
  .stage-btn[data-stage="programado"].active{ background: rgba(63,191,159,0.16); border-color: var(--programado); color: var(--programado); }
  .stage-btn[data-stage="vacio"].active{ background: rgba(139,147,161,0.16); border-color: var(--muted); color: var(--text); }

  .add-slot-btn{
    width:100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px dashed var(--border);
    background: none;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    margin-top: 4px;
  }
  .remove-slot{
    background:none; border:none; color: var(--muted); font-size: 13px;
    float:right; cursor:pointer; margin-top:-2px;
  }

  .plat-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 12px 0 8px;
  }
  .plat-row{
    display:flex;
    gap: 6px;
  }
  .plat-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-family:'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 9px 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
  }
  .plat-btn .chk{
    width:14px; height:14px;
    border-radius: 4px;
    border: 1.5px solid var(--muted);
    flex-shrink:0;
    position:relative;
  }
  .plat-btn.on{ color: var(--text); border-color: var(--programado); background: rgba(63,191,159,0.1); }
  .plat-btn.on .chk{ background: var(--programado); border-color: var(--programado); }
  .plat-btn.on .chk::after{
    content:'✓';
    position:absolute; top:-3px; left:1.5px;
    font-size: 10px; color: #0d1310; font-weight:700;
  }

  .loading{ text-align:center; padding: 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Dos videos por día</p>
  <h1>Calendario de contenido</h1>
</header>

<div class="month-nav">
  <button onclick="changeMonth(-1)">‹</button>
  <div class="month-label" id="monthLabel">—</div>
  <button onclick="changeMonth(1)">›</button>
</div>

<div class="legend">
  <span><span class="sw" style="background:var(--vacio)"></span>Sin idea</span>
  <span><span class="sw" style="background:var(--idea)"></span>Idea</span>
  <span><span class="sw" style="background:var(--editado)"></span>Editado</span>
  <span><span class="sw" style="background:var(--programado)"></span>Programado</span>
</div>

<div class="cal-wrap">
  <div class="weekdays">
    <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
  </div>
  <div class="grid" id="grid">
    <div class="loading">Cargando...</div>
  </div>
</div>

<div class="month-summary" id="monthSummary" style="display:none;"></div>



<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalDate">—</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="slotsContainer"></div>
    <button class="add-slot-btn" id="addSlotBtn" onclick="addSlot()">+ Agregar otro video este día</button>
  </div>
</div>

<script>
const STAGE_ORDER = ['vacio','idea','editado','programado'];
const STAGE_LABELS = {vacio:'Sin idea', idea:'Idea', editado:'Editado', programado:'Programado'};
const PLATFORMS = [
  {key:'instagram', label:'Instagram'},
  {key:'tiktok', label:'TikTok'},
  {key:'youtube', label:'YouTube'}
];
const STORAGE_KEY = 'contenido-calendario-v1';

let data = {}; // { 'YYYY-MM-DD': [ {title, stage, platforms:{instagram,tiktok,youtube}}, ... ] }
let currentMonth = new Date();
currentMonth.setDate(1);
let openDateISO = null;

function isoOf(y,m,d){
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function todayISO(){
  const d = new Date();
  return isoOf(d.getFullYear(), d.getMonth(), d.getDate());
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    data = raw ? JSON.parse(raw) : {};
  }catch(e){
    console.error('No se pudo leer el almacenamiento local', e);
    data = {};
  }
  render();
}

function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

function emptyPlatforms(){
  return {instagram:false, tiktok:false, youtube:false};
}

function getSlots(iso){
  const slots = data[iso] || [{title:'', stage:'vacio', platforms: emptyPlatforms()}, {title:'', stage:'vacio', platforms: emptyPlatforms()}];
  // backfill platforms for older saved entries
  return slots.map(s => ({...s, platforms: s.platforms || emptyPlatforms()}));
}

function changeMonth(delta){
  currentMonth.setMonth(currentMonth.getMonth() + delta);
  render();
}

function render(){
  const y = currentMonth.getFullYear();
  const m = currentMonth.getMonth();

  document.getElementById('monthLabel').textContent =
    currentMonth.toLocaleDateString('es-ES', {month:'long', year:'numeric'});

  const firstDay = new Date(y, m, 1);
  // Monday-first index: 0=Mon ... 6=Sun
  let startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  for(let i=0; i<startOffset; i++){
    const filler = document.createElement('div');
    filler.className = 'cell empty-cell';
    grid.appendChild(filler);
  }

  const today = todayISO();
  let coveredDays = 0, needIdeaDays = 0, inProgressDays = 0;

  for(let d=1; d<=daysInMonth; d++){
    const iso = isoOf(y,m,d);
    const slots = getSlots(iso);
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(iso === today) cell.classList.add('today');

    const covered = slots.length >= 2 && slots.every(s => s.stage === 'programado');
    const allEmpty = slots.every(s => s.stage === 'vacio');
    const isPastOrToday = iso <= today;

    if(covered) cell.classList.add('covered');
    if(allEmpty && isPastOrToday) cell.classList.add('needs-attention');

    if(covered) coveredDays++;
    else if(allEmpty) needIdeaDays++;
    else inProgressDays++;

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = d;

    const dots = document.createElement('div');
    dots.className = 'dots';
    slots.forEach(s => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (s.stage !== 'vacio' ? ' ' + s.stage : '');
      dots.appendChild(dot);
    });

    cell.appendChild(num);
    cell.appendChild(dots);
    cell.onclick = () => openDay(iso);
    grid.appendChild(cell);
  }

  const summary = document.getElementById('monthSummary');
  summary.style.display = 'flex';
  summary.innerHTML = `
    <div class="stat"><b style="color:var(--programado)">${coveredDays}</b><span>Cubiertos</span></div>
    <div class="stat"><b style="color:var(--editado)">${inProgressDays}</b><span>En proceso</span></div>
    <div class="stat"><b style="color:var(--warn)">${needIdeaDays}</b><span>Sin idea</span></div>
  `;
}

function openDay(iso){
  openDateISO = iso;
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  document.getElementById('modalDate').textContent = dt.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});
  renderSlots();
  document.getElementById('modalBackdrop').classList.add('open');
}

function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
  openDateISO = null;
}

function renderSlots(){
  const slots = getSlots(openDateISO);
  const container = document.getElementById('slotsContainer');
  container.innerHTML = '';

  slots.forEach((slot, idx) => {
    const box = document.createElement('div');
    box.className = 'slot';

    const label = document.createElement('div');
    label.className = 'slot-label';
    label.textContent = `Video ${idx+1}`;
    if(slots.length > 2){
      const rm = document.createElement('button');
      rm.className = 'remove-slot';
      rm.textContent = 'Quitar';
      rm.onclick = () => removeSlot(idx);
      label.appendChild(rm);
    }

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Título o idea (opcional)';
    input.value = slot.title || '';
    input.oninput = (e) => updateSlot(idx, {title: e.target.value});

    const stageRow = document.createElement('div');
    stageRow.className = 'stage-row';
    STAGE_ORDER.forEach(st => {
      const btn = document.createElement('button');
      btn.className = 'stage-btn' + (slot.stage === st ? ' active' : '');
      btn.dataset.stage = st;
      btn.textContent = STAGE_LABELS[st];
      btn.onclick = () => updateSlot(idx, {stage: st});
      stageRow.appendChild(btn);
    });

    const platLabel = document.createElement('div');
    platLabel.className = 'plat-label';
    platLabel.textContent = 'Subido a';

    const platRow = document.createElement('div');
    platRow.className = 'plat-row';
    PLATFORMS.forEach(p => {
      const isOn = !!slot.platforms[p.key];
      const btn = document.createElement('button');
      btn.className = 'plat-btn' + (isOn ? ' on' : '');
      btn.innerHTML = `<span class="chk"></span>${p.label}`;
      btn.onclick = () => {
        const platforms = {...slot.platforms, [p.key]: !isOn};
        updateSlot(idx, {platforms});
      };
      platRow.appendChild(btn);
    });

    box.appendChild(label);
    box.appendChild(input);
    box.appendChild(stageRow);
    box.appendChild(platLabel);
    box.appendChild(platRow);
    container.appendChild(box);
  });
}

function updateSlot(idx, patch){
  const slots = getSlots(openDateISO).map(s => ({...s, platforms: {...s.platforms}}));
  slots[idx] = {...slots[idx], ...patch};
  data[openDateISO] = slots;
  persist();
  renderSlots();
  render();
}

function addSlot(){
  const slots = getSlots(openDateISO).map(s => ({...s}));
  slots.push({title:'', stage:'vacio', platforms: emptyPlatforms()});
  data[openDateISO] = slots;
  persist();
  renderSlots();
  render();
}

function removeSlot(idx){
  const slots = getSlots(openDateISO).map(s => ({...s}));
  slots.splice(idx, 1);
  data[openDateISO] = slots;
  persist();
  renderSlots();
  render();
}

loadData();
</script>
</body>
</html>
